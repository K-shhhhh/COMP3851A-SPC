# Extra staging settings for a CPU-only server. Layer this AFTER
# docker-compose.staging.yml; scripts/staging.sh does that for you.
#
# Why these exist:
#  * Embeddings run on the server's CPU through Ollama, but most of an upload's
#    time is spent waiting on the AI provider (picture descriptions and the
#    knowledge graph). Three documents at once keep the CPU busy without
#    overloading it. --prefetch-multiplier=1 stops a worker from hoarding
#    queued uploads, so a restart cannot leave many of them stranded.
#  * Ollama unloads a model after 5 idle minutes by default. Every question
#    needs the embedding model, so the first question after a quiet period would
#    pay a reload delay. Keeping it loaded removes that.
name: spc-staging

services:
  ollama:
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=3 --prefetch-multiplier=1
